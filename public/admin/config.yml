backend:
  name: github
  repo: ppriede/KuLtura-astro
  branch: main

# local: npx decap-server (proxies git local, sin OAuth) + npm run dev → /admin/
local_backend: true

# espejo de src/content.config.ts — si cambia el schema Zod, cambiar aquí también
media_folder: public/images/portadas
public_folder: /images/portadas

collections:
  - name: articulos
    label: Artículos
    label_singular: Artículo
    folder: src/content/articulos
    create: true
    slug: "{{slug}}"
    sortable_fields: [titulo, fecha]
    sort: "fecha:desc"
    fields:
      - {label: "Título", name: "titulo", widget: "string"}
      - label: "Categoría"
        name: "categoria"
        widget: "select"
        options: ["musica", "arte", "literatura", "fotografia", "columnas"]
      - label: "Fecha"
        name: "fecha"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
      - {label: "Autor", name: "autor", widget: "string"}
      - label: "Portada"
        name: "portada"
        widget: "image"
        choose_url: true
      - {label: "Resumen", name: "resumen", widget: "text", required: false}
      - label: "Estado"
        name: "estado"
        widget: "select"
        options: ["publico", "privado", "archivado", "borrador"]
        default: "publico"
      - {label: "Ocultar portada", name: "ocultar_portada", widget: "boolean", default: false}
      - {label: "Ocultar resumen", name: "ocultar_resumen", widget: "boolean", default: false}
      - {label: "Ocultar autor", name: "ocultar_autor", widget: "boolean", default: true}
      - {label: "Cuerpo", name: "body", widget: "markdown"}
